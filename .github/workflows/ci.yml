name: CI

on:
  push:
    branches: [main, master, feature/admin-web, feature/trainers-management]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tennis:tennis_test_password@localhost:5432/tennis_academy_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis_test_password
          POSTGRES_DB: tennis_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennis -d tennis_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma migrate deploy --schema ./prisma/schema.prisma
      - run: npm run prisma:generate -w @tennis/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build

  customer-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test -w @tennis/customer-web
      - run: npm run typecheck -w @tennis/customer-web
      - run: npm run build -w @tennis/customer-web

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @tennis/admin-web
      - run: npm run build -w @tennis/admin-web
